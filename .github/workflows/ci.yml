name: CI

# Runs on every push to main and dev, and on every pull request.
#
# The documentation job is not decoration. The docs/ tree is a cross-referenced
# graph whose integrity constraints cannot be verified by reading: a link breaks
# when a different file is renamed in a different commit, and nothing in the file
# containing the link changes. See scripts/check_docs.py and ADR-012.
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  docs:
    name: Documentation integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: check_docs
        run: python scripts/check_docs.py

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --all-extras

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --all-extras

      - name: mypy
        run: uv run mypy

  licence:
    # CONST-TECH: every runtime dependency must be under a licence whose terms
    # AGPL-3.0-or-later can satisfy (ADR-022 inverted the ADR-006 policy: the
    # question is no longer whether a dependency is copyleft, but whether the
    # combined AGPL work can satisfy it). This step must fail the build when a
    # non-qualifying dependency is introduced.
    name: Dependency licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.10

      - name: licensecheck
        run: uvx licensecheck --zero --format simple

  test:
    # ADR-006: minimum Python 3.10, three-version window, Linux and macOS
    # blocking, Windows best-effort.
    name: Tests (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: pytest
        run: uv run pytest
